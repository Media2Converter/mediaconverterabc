<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メディアコンバータ - 弾薬モード</title>
    <meta name="description" content="無料でビデオ・オーディオファイルを変換します。">
    <meta name="author" content="Lovable" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/38bfe783-95b2-4192-8370-dbd2f0247263/id-preview-37fcec33--1d6cdcc3-4e4a-42b3-9504-fc113ba89f02.lovable.app-1783839767224.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/38bfe783-95b2-4192-8370-dbd2f0247263/id-preview-37fcec33--1d6cdcc3-4e4a-42b3-9504-fc113ba89f02.lovable.app-1783839767224.png">
    <meta property="og:title" content="メディアコンバータ">
    <meta name="twitter:title" content="メディアコンバータ">
    <meta property="og:description" content="無料でビデオ・オーディオファイルを変換します。">
    <meta name="twitter:description" content="無料でビデオ・オーディオファイルを変換します。">

    <!-- FFmpeg WASM Standalone Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

    <!-- 弾薬モード (Tactical Dark Ammo) テーマスタイル -->
    <style>
      :root {
        --ammo-gold: #d4af37;
        --ammo-brass: #e5a93c;
        --ammo-dark: #121411;
        --ammo-card: #1c201a;
        --ammo-panel: #262c24;
        --text-main: #f0f2ee;
        --text-sub: #8c9688;
        --border-color: #3b4438;
        --radius: 12px;
      }

      * { box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--ammo-dark);
        color: var(--text-main);
        margin: 0;
        padding: 20px 16px;
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }

      .app-container {
        width: 100%;
        max-width: 520px;
        background: var(--ammo-card);
        border-radius: var(--radius);
        padding: 28px 24px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
        border: 2px solid var(--border-color);
        position: relative;
        overflow: hidden;
      }

      .app-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: var(--ammo-gold);
      }

      .header {
        text-align: center;
        margin-bottom: 24px;
      }

      .header h1 {
        font-size: 24px;
        font-weight: 800;
        margin: 0 0 6px 0;
        color: var(--ammo-gold);
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .header p {
        font-size: 13px;
        color: var(--text-sub);
        margin: 0;
      }

      .server-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        padding: 6px 14px;
        border-radius: 6px;
        margin-top: 12px;
        background: var(--ammo-panel);
        color: #e0e0e0;
        border: 1px solid var(--border-color);
        font-weight: 600;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e5a93c;
      }

      .dot.online { background: #30d158; box-shadow: 0 0 8px #30d158; }
      .dot.closed { background: #ff453a; box-shadow: 0 0 8px #ff453a; }

      .form-section { margin-bottom: 20px; }

      .label-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--ammo-brass);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
        display: block;
      }

      .file-picker {
        border: 2px dashed var(--ammo-gold);
        border-radius: 10px;
        padding: 24px;
        text-align: center;
        background: rgba(212, 175, 55, 0.05);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .file-picker:hover {
        background: rgba(212, 175, 55, 0.12);
        border-color: var(--ammo-brass);
      }

      .file-picker input { display: none; }

      .file-picker-text {
        color: var(--ammo-gold);
        font-weight: 700;
        font-size: 15px;
      }

      .file-name-info {
        font-size: 13px;
        color: #ffffff;
        margin-top: 6px;
        word-break: break-all;
      }

      select {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background-color: var(--ammo-panel);
        color: #ffffff;
        appearance: none;
        -webkit-appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 12px center;
        background-size: 16px;
      }

      select:focus {
        outline: none;
        border-color: var(--ammo-gold);
      }

      .submit-btn {
        width: 100%;
        padding: 16px;
        font-size: 16px;
        font-weight: 800;
        color: #121411;
        background: linear-gradient(135deg, var(--ammo-gold), var(--ammo-brass));
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        letter-spacing: 1px;
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        transition: all 0.2s;
      }

      .submit-btn:active {
        transform: scale(0.98);
      }

      .submit-btn:disabled {
        background: #3a3f38;
        color: #666c64;
        box-shadow: none;
        cursor: not-allowed;
      }

      .status-card {
        margin-top: 20px;
        padding: 14px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        display: none;
        word-break: break-word;
      }

      .status-info { background: #1a2a38; color: #82b1ff; border: 1px solid #2c4a6f; }
      .status-success { background: #193822; color: #81c784; border: 1px solid #2e5c38; }
      .status-error { background: #3d1c1d; color: #e57373; border: 1px solid #6b2d2f; }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="app-container">
        <div class="header">
          <h1>
            <span><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L9 8h6l-3-6zm-3 8v12h6V10H9z"/></svg></span>
            弾薬モード コンバータ
          </h1>
          <p>スタンドアロン高速メディア変換エンジン</p>
          <div class="server-badge">
            <span id="serverDot" class="dot"></span>
            <span id="serverStatusText">ステータス確認中... (06:00〜23:00)</span>
          </div>
        </div>

        <div class="form-section">
          <span class="label-title">1. 対象ファイルロード</span>
          <div class="file-picker" onclick="document.getElementById('fileInput').click()">
            <div class="file-picker-text">タップして動画または音声を装填</div>
            <div id="fileDisplay" class="file-name-info">ファイル未装填</div>
            <input type="file" id="fileInput" accept="video/*,audio/*" onchange="onFileSelected()" />
          </div>
        </div>

        <div class="form-section">
          <span class="label-title">2. ターゲットフォーマット</span>
          <select id="format">
            <option value="mp4" selected>MP4 (標準 / iPhone対応)</option>
            <option value="mov">MOV (QuickTime)</option>
            <option value="avi">AVI (クラシック/レトロ)</option>
            <option value="webm">WebM (Web動画)</option>
            <option value="mp3">MP3 (音声のみ抽出)</option>
          </select>
        </div>

        <button id="convertBtn" class="submit-btn" onclick="submitConversion()">変換プロセス実行</button>

        <div id="statusCard" class="status-card"></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      let ffmpegEngine = null;

      window.addEventListener('DOMContentLoaded', () => {
        checkBusinessHours();
      });

      function checkBusinessHours() {
        const dot = document.getElementById('serverDot');
        const text = document.getElementById('serverStatusText');
        const btn = document.getElementById('convertBtn');

        const nowJST = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Tokyo" }));
        const hour = nowJST.getHours();

        const isWorking = (hour >= 6 && hour < 23);

        if (!isWorking) {
          dot.className = 'dot closed';
          text.innerText = 'サーバの営業時間が終了しました。(06:00〜23:00)';
          btn.disabled = true;
          setStatus('サーバの営業時間が終了しました。', 'error');
        } else {
          dot.className = 'dot online';
          text.innerText = '作戦稼働中 (06:00〜23:00)';
          btn.disabled = false;
        }
      }

      function onFileSelected() {
        const input = document.getElementById('fileInput');
        const display = document.getElementById('fileDisplay');
        display.innerText = input.files.length ? input.files[0].name : 'ファイル未装填';
      }

      async function submitConversion() {
        const fileInput = document.getElementById('fileInput');
        const btn = document.getElementById('convertBtn');

        const nowJST = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Tokyo" }));
        const hour = nowJST.getHours();
        if (hour < 6 || hour >= 23) {
          setStatus('サーバの営業時間が終了しました。', 'error');
          return;
        }

        if (!fileInput.files.length) {
          setStatus('ファイルを選択してください。', 'error');
          return;
        }

        const file = fileInput.files[0];
        const targetFormat = document.getElementById('format').value;
        const outputFileName = `converted_${Date.now()}.${targetFormat}`;

        btn.disabled = true;
        setStatus('変換エンジン初期化中...', 'info');

        try {
          if (!ffmpegEngine) {
            const { createFFmpeg } = FFmpeg;
            ffmpegEngine = createFFmpeg({ log: false });
          }

          if (!ffmpegEngine.isLoaded()) {
            await ffmpegEngine.load();
          }

          setStatus('ファイルをメモリに読み込み中...', 'info');
          const { fetchFile } = FFmpeg;
          ffmpegEngine.FS('writeFile', 'input_file', await fetchFile(file));

          setStatus('変換実行中... (端末のローカル処理)', 'info');

          if (targetFormat === 'mp3') {
            await ffmpegEngine.run('-i', 'input_file', '-vn', '-acodec', 'libmp3lame', outputFileName);
          } else {
            await ffmpegEngine.run('-i', 'input_file', outputFileName);
          }

          const data = ffmpegEngine.FS('readFile', outputFileName);
          const blob = new Blob([data.buffer], { type: `video/${targetFormat}` });
          const downloadUrl = URL.createObjectURL(blob);

          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = outputFileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(downloadUrl);

          setStatus('変換完了！ファイルを出力保存しました。', 'success');
        } catch (err) {
          console.error('Conversion error:', err);
          setStatus('変換処理エラー: ' + err.message, 'error');
        } finally {
          btn.disabled = false;
        }
      }

      function setStatus(text, type) {
        const box = document.getElementById('statusCard');
        box.style.display = 'block';
        box.innerText = text;
        box.className = 'status-card status-' + type;
      }
    </script>
  </body>
</html>
